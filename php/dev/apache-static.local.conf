# LOCAL TESTING ONLY — the static export served the way production will serve it:
#
#   http://pixelmani.test:{{PORT}}/          → out/ (static HTML/CSS/JS from `npm run build`)
#   http://pixelmani.test:{{PORT}}/api/*     → PHP (php/public/api)
#   http://pixelmani.test:{{PORT}}/media/*   → files in php/public/media
#
# No Node.js process is involved. This is a template: php/dev/serve-static.mjs
# fills in the {{…}} values and runs a separate Apache instance on its own
# port, so Laragon's own Apache and the `npm run dev` proxy vhost
# (apache-vhost.local.conf) stay untouched.
#
# Only out/, php/public/api and php/public/media are mapped; nothing else in the
# repository (php/src, php/config, php/storage, db/, .env*) is reachable.
#
# Production Apache/.htaccess rules are Phase 10; nothing here is meant for Loopia.

ServerRoot "{{SERVER_ROOT}}"
Listen 127.0.0.1:{{PORT}}
ServerName localhost
PidFile "{{RUNTIME}}/httpd.pid"
ErrorLog "{{RUNTIME}}/error.log"
LogLevel warn

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule alias_module modules/mod_alias.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
TypesConfig conf/mime.types

LogFormat "%h %t \"%r\" %>s %b" common
CustomLog "{{RUNTIME}}/access.log" common

<Directory />
    AllowOverride None
    Require all denied
</Directory>

Include "{{MOD_PHP_CONF}}"

Define PIXELMANI_ROOT "{{ROOT}}"

<VirtualHost *:{{PORT}}>
    ServerName pixelmani.test
    DocumentRoot "${PIXELMANI_ROOT}/out"

    # The site's origin includes the port here, so PHP's same-origin check
    # must expect it. Local test override only; .env.loopia.local is unchanged.
    SetEnv SITE_URL "http://pixelmani.test:{{PORT}}"

    # Security headers that moved out of next.config.ts (see "Apache handoff"
    # in php/README.md). Tested here so the static export is known to work
    # under them. HSTS and upgrade-insecure-requests are production-only
    # (https); they would break this plain-http test.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    # PHP sends nosniff itself (normal header table); drop that copy so the
    # response carries exactly one.
    Header unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Header always set X-Frame-Options "DENY"

    # Static export. Next writes <route>.html next to a <route>/ directory of
    # client-navigation payloads, so /admin must not be redirected to /admin/:
    # clean URLs map to the .html file instead.
    <Directory "${PIXELMANI_ROOT}/out">
        Options -Indexes -MultiViews -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        DirectorySlash Off
        <IfModule php_module>
            php_admin_flag engine off
        </IfModule>

        RewriteEngine On
        # /showcase/ → 301 /showcase (one canonical form, as the Next server did)
        RewriteCond %{DOCUMENT_ROOT}/$1.html -f
        RewriteRule ^(.+)/$ /$1 [R=301,END]
        # /showcase → showcase.html
        RewriteCond %{REQUEST_FILENAME}.html -f
        RewriteRule ^(.+)$ $1.html [END]
    </Directory>
    ErrorDocument 404 /404.html

    # PHP API: /api/<name>, /api/admin/<name>, /api/admin/<group>/<name> → <same>.php
    Alias /api "${PIXELMANI_ROOT}/php/public/api"
    <Directory "${PIXELMANI_ROOT}/php/public/api">
        Options -Indexes -MultiViews -ExecCGI
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /api/
        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule ^((?:admin/(?:(?:photos|categories|hero)/)?)?[a-z0-9-]+)$ $1.php [END]
    </Directory>

    # Photo files: served as files, never executed.
    Alias /media "${PIXELMANI_ROOT}/php/public/media"
    <Directory "${PIXELMANI_ROOT}/php/public/media">
        Options -Indexes -MultiViews -ExecCGI
        AllowOverride None
        Require all granted
        <IfModule php_module>
            php_admin_flag engine off
        </IfModule>
    </Directory>
</VirtualHost>

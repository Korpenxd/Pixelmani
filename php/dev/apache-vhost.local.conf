# LOCAL DEVELOPMENT ONLY — Apache virtual host for http://pixelmani.test
#
# Serves ONLY php/public, never the repository root (which contains .env files,
# the Supabase export bundle and source code).
#
# Install (Laragon):
#   1. Copy this file to  C:\laragon\etc\apache2\sites-enabled\pixelmani.test.conf
#   2. Replace the path in the Define line with the absolute path of this repo
#      (forward slashes).
#   3. Add "127.0.0.1 pixelmani.test" to the hosts file (Laragon does this for
#      you when it runs as administrator), then Laragon → Apache → Reload.
#
# Production Apache/.htaccess rules are a separate phase; nothing here is
# meant for Loopia.

Define PIXELMANI_ROOT "C:/path/to/Pixelmani"

<VirtualHost *:80>
    ServerName pixelmani.test
    DocumentRoot "${PIXELMANI_ROOT}/php/public"

    <Directory "${PIXELMANI_ROOT}/php/public">
        Options -Indexes -MultiViews -ExecCGI
        AllowOverride None
        Require all granted

        # /api/<name> and /api/admin/<name> → <same>.php for existing endpoint files only.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule ^(api/(?:admin/)?[a-z0-9-]+)$ $1.php [END]
    </Directory>
</VirtualHost>

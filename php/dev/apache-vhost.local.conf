# LOCAL DEVELOPMENT ONLY — Apache virtual host for http://pixelmani.test
#
# One origin for everything, so the PHP admin session cookie, Origin checks and
# CSRF work exactly as in production:
#
#   http://pixelmani.test/api/*     → PHP (php/public/api)
#   http://pixelmani.test/media/*   → files in php/public/media
#   everything else                 → reverse proxy to the Next.js process on
#                                     http://127.0.0.1:3000 (pages, /_next/*)
#
# Apache serves ONLY php/public, never the repository root (which contains .env
# files, the Supabase export bundle and source code). /api and /media are never
# proxied to Next, so the old Next /api/admin/* routes are unreachable here.
#
# Start Next for this setup (repository root):   npm run dev
# (next dev on port 3000; .env.local provides PIXELMANI_BUILD_API_BASE). When
# Next is not running, pages give 503 while /api and /media keep working.
#
# Install (Laragon):
#   1. Copy this file to  C:\laragon\etc\apache2\sites-enabled\pixelmani.test.conf
#   2. Replace the path in the Define line with the absolute path of this repo
#      (forward slashes).
#   3. Add "127.0.0.1 pixelmani.test" to the hosts file (Laragon does this for
#      you when it runs as administrator), then Laragon → Apache → Reload.
#
# Production does not use this proxy (the final site is a static export served
# by Apache). Nothing here is meant for Loopia: the production rules are
# deploy/loopia/public/.htaccess.

Define PIXELMANI_ROOT "C:/path/to/Pixelmani"

# Proxy modules ship with Laragon's Apache but are not loaded by default.
# Loaded here so the global httpd.conf stays untouched.
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !proxy_wstunnel_module>
    LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>

<VirtualHost *:80>
    ServerName pixelmani.test
    DocumentRoot "${PIXELMANI_ROOT}/php/public"

    <Directory "${PIXELMANI_ROOT}/php/public">
        Options -Indexes -MultiViews -ExecCGI
        AllowOverride None
        Require all granted

        # /api/<name>, /api/admin/<name> and /api/admin/<group>/<name> → <same>.php
        # for existing endpoint files only. <group> is one of the admin route
        # groups (photos, categories, hero); names are letters, digits and "-".
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule ^(api/(?:admin/(?:(?:photos|categories|hero)/)?)?[a-z0-9-]+)$ $1.php [END]
    </Directory>

    # Everything except /api and /media goes to Next. Exclusions come first.
    # Forward proxying stays off; only this reverse mapping exists.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /api !
    ProxyPass        /media !
    # next dev hot reload (websocket)
    ProxyPass        /_next/webpack-hmr ws://127.0.0.1:3000/_next/webpack-hmr
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

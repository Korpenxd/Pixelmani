# LOCAL TESTING ONLY: the assembled Loopia deployment package, served the way
# Loopia will serve it.
#
#   npm run package:loopia   →  dist/loopia/pixelmani-loopia-precutover/
#   npm run serve:package    →  this file, filled in by php/dev/serve-static.mjs
#
#   http://pixelmani.test:{{PORT}}/        DocumentRoot = <package>/public, with the
#                                          package's OWN .htaccess files (production rules)
#   https://…:{{TLS_PORT}}/                same, over TLS with a throwaway self-signed
#                                          certificate (only when openssl is available),
#                                          to test HTTPS-only behaviour (HSTS, redirects)
#
# Nothing from the repository is served or loaded: PHP runs the package's
# public/api/*.php, which load the package's bootstrap.php, src/ and vendor/,
# and write to the package's storage/ and public/media/. The only thing from
# outside the package is the local test configuration (PIXELMANI_CONFIG, in
# the temporary runtime folder): local database, Mailpit and SITE_URL.
#
# AllowOverride is exactly the minimum DEPLOY.md asks Loopia for, so this
# also proves the .htaccess files need nothing more.

ServerRoot "{{SERVER_ROOT}}"
Listen 127.0.0.1:{{PORT}}
ServerName localhost
PidFile "{{RUNTIME}}/httpd.pid"
ErrorLog "{{RUNTIME}}/error.log"
LogLevel warn

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
TypesConfig conf/mime.types

LogFormat "%h %t \"%r\" %{Host}i %>s %b" withhost
CustomLog "{{RUNTIME}}/access.log" withhost

<Directory />
    AllowOverride None
    Require all denied
</Directory>

Include "{{MOD_PHP_CONF}}"

Define PIXELMANI_PACKAGE "{{PACKAGE}}"

<Directory "${PIXELMANI_PACKAGE}/public">
    Options FollowSymLinks
    AllowOverride FileInfo Indexes Options AuthConfig
    Require all granted
</Directory>

<VirtualHost *:{{PORT}}>
    ServerName pixelmani.test
    ServerAlias pixelmani.se www.pixelmani.se
    DocumentRoot "${PIXELMANI_PACKAGE}/public"
    SetEnv PIXELMANI_CONFIG "{{RUNTIME}}/config.php"
</VirtualHost>

{{TLS_BLOCK}}
